  id: 314fdced-c367-4ce8-bf02-9f5c6949bf11
  memo: 'willingness to consider the use of frugal and neutral models '
  selected_text: Although the problems with AI regarding open source projects don’t
    disappear with alternatives, FreeCAD as a project wants to raise awareness of
    alternatives to the large LLMs that can only be trained by large organizations.
    Examples are frugal AI initiatives and fully open source AI models such as Apertus
    that is trained on fully open data in a carbon-neutral and water-neutral data
    center
  start: 2319
- codes:
  - de0ba345-0c14-5cdb-9594-d58e42f55232
  - 89d5d2d3-96f1-58d9-a745-408e37ac3518
  - 43e917f6-1e21-54c7-9aac-d9dcf17a2c46
  - b5cc0904-0ce4-5526-97e7-43056a6b7b54
  - 2a7965ce-3d9b-5b47-844a-f61c2e16e376
  end: 4065
  id: 8484cfdc-a891-4295-a14f-c1aaa1e6302a
  memo: ''
  selected_text: That's why for each contribution we expect it to have human behind
    the wheel throughout the whole process and be presented by humans, not AI tools.
    While it won't be possible to verify that fully, we trust our community to do
    the right thing and contribute in a good faith with these values in mind. In particular,
    we will not accept pull requests with clearly AI-generated code, commit messages,
    PR descriptions, and responses to reviewer feedback.
  start: 3616
- codes:
  - de0ba345-0c14-5cdb-9594-d58e42f55232
  - 89d5d2d3-96f1-58d9-a745-408e37ac3518
  - 2fc2f90b-8277-4ada-b3dd-9123ccd8d0aa
  end: 4798
  id: 8c66c027-bf27-4fa5-bffb-7db49beced38
  memo: ''
  selected_text: We ask the contributor in the Pull Request template to mark a required
    checkbox that says “This PR is not unverified AI output, I take responsibility
    for it, and all communication from my side in this PR is done by me personally.”.
    Don't be afraid that your English is not perfect - we are mostly non-native speakers.
    We don't recommend using machine translation, but if you do - add original text
    too.
  start: 4396
- codes:
  - 5a065616-b081-51fa-97ba-f8f8225409ef
  - fde7a31d-d03a-5d50-8aa5-b9fa307b00f8
  end: 5061
  id: 873f5304-3892-4ce2-9263-712ddb4426a4
  memo: By default, unknown contributors will be tagged as “unverified code.”
  selected_text: PRs from outside the Developers group will be marked as "Unverified"
    to help us find potential violations.  After several successful contributions
    we will add new contributors to the groups - but don't hesitate to ask us to do
    it sooner.
  start: 4824
