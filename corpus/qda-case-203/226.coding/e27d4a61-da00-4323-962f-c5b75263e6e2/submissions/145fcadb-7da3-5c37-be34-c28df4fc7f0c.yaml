  id: a3c184b3-d777-4f23-909b-ed683437314d
  memo: 'AI provides low quality code. '
  selected_text: 'At this point, they pose both the risk of lowering the quality of
    Gentoo projects, '
  start: 1388
- codes:
  - 644db4fc-3d94-59ee-a2a7-a47d3e382582
  end: 1614
  id: 92134242-8889-4d8f-800e-c6a09d0bbfd9
  memo: 'workload for human maintenance staff '
  selected_text: ' an unfair human effort from developers and users to review contributions
    and detect the mistakes resulting from the use of AI.'
  start: 1487
- codes:
