  memo: interdiction tu use generatie AI
  selected_text: It is expressly forbidden to contribute to Gentoo any content that
    has been created with the assistance of Natural Language Processing artificial
    intelligence tools.
  start: 255
- codes:
  - c4eb675a-13ab-5d8b-acfc-317e62b8fc37
  end: 1166
  id: f7466351-0785-49d0-af11-76402c921051
  memo: ''
  selected_text: Copyright concerns.** At this point, the regulations concerning copyright
    of generated contents are still emerging worldwide. Using such material could
    pose a danger of copyright violations, but it could also weaken Gentoo claims
    to copyright and void the guarantees given by copyleft licensing.
  start: 871
- codes:
