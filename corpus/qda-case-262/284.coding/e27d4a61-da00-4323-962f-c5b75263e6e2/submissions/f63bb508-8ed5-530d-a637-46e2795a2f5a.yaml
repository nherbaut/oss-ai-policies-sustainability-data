  memo: AI totally forbidden
  selected_text: 'Important


    We forbid the use of generative AI tools in Nura.


    The following is not allowed in Nura:


    - Submitting contributions fully or in part created by generative AI tools to
    Nura.


    - Recommending generative AI tools to other community members for solving problems
    in the Nura space.


    If somebody keeps on violating these rules, we may escalate the situation according
    to the [Code of Conduct Enforcement Guidelines](../community/code-of-conduct.html#coc-enforcement-guidelines)
    with warnings and temporary/permanent bans.'
  start: 4167
