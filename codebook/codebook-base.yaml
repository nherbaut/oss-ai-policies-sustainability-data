  kind: code
  memo: '“This occurs when a product or software becomes overloaded with excessive
    features, many of which may be unnecessary for the user. Feature bloat can lead
    to a more complex and difficult-to-use product, increased resource consumption,
    and a shorter lifespan as the system becomes unwieldy.”


    — Sustainability Category Correlations.xlsx, Definitions!A18, entry “Feature Bloat”.
    Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
