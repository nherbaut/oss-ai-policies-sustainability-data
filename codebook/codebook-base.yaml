  taxonomy:
    categories:
    - category_location: categories and metrics.png, Environmental / Carbon Footprint
      coding_guidance: Coder les mentions d’émissions, de CO2 ou d’empreinte carbone
        ; ne pas convertir automatiquement une économie de temps de revue en réduction
        carbone.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A2
      dimension: Environmental
      id: TAX-01
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A2, entry
          “Carbon Footprint”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This is a measure of the total greenhouse gas (GHG) emissions caused
          directly and indirectly by an individual, organization, event, or product.
          It is expressed in terms of the amount of carbon dioxide (CO2) or its equivalent
          of other GHGs. The carbon footprint considers the entire life cycle of a
          product or activity, from the extraction of raw materials to its final disposal.
      normalized_label: Carbon Footprint
      operational_definition: Émissions de gaz à effet de serre associées au cycle
        de vie, à la production ou à l’usage de la GenAI et du logiciel.
      raw_label: Carbon Footprint
      reference_keys:
      - roy2026taxonomy
      source_definition: This is a measure of the total greenhouse gas (GHG) emissions
        caused directly and indirectly by an individual, organization, event, or product.
        It is expressed in terms of the amount of carbon dioxide (CO2) or its equivalent
        of other GHGs. The carbon footprint considers the entire life cycle of a product
        or activity, from the extraction of raw materials to its final disposal.
      source_definition_label: Carbon Footprint
      source_metrics: Software Carbon Intensity
      status: source_authored
    - category_location: categories and metrics.png, Environmental / Energy Consumption
      coding_guidance: Inclure les liens explicites à l’énergie ; ne pas déduire une
        consommation énergétique mesurée d’une simple mention de performance.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A4
      dimension: Environmental
      id: TAX-02
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A4, entry
          “Energy Consumption”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This refers to the total amount of energy utilized in a particular process
          or by a specific entity, such as a household or a business. It is a critical
          component of the environmental impact, as energy production, particularly
          from fossil fuels, is a major source of greenhouse gas emissions. The concept
          is intrinsically linked to energy efficiency, where higher consumption indicates
          lower efficiency.
      normalized_label: Energy Consumption
      operational_definition: Consommation et efficacité énergétiques des systèmes,
        de leur développement et de leur usage.
      raw_label: Energy Consumption
      reference_keys:
      - roy2026taxonomy
      source_definition: This refers to the total amount of energy utilized in a particular
        process or by a specific entity, such as a household or a business. It is
        a critical component of the environmental impact, as energy production, particularly
        from fossil fuels, is a major source of greenhouse gas emissions. The concept
        is intrinsically linked to energy efficiency, where higher consumption indicates
        lower efficiency.
      source_definition_label: Energy Consumption
      source_metrics: Energy efficiency; Runtime efficiency; CPU-intensity; memory
        usage; peripheral intensity; idleness; Algorithmic efficiency
      status: source_authored
    - category_location: categories and metrics.png, Environmental / E-waste
      coding_guidance: Distinguer déchets matériels et code supprimé. La métrique
        source « non-reusable modules » est ambiguë et ne suffit pas à assimiler du
        code à un déchet électronique.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A6
      dimension: Environmental
      id: TAX-03
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A6, entry
          “E-waste”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI
          10.1145/3786148.3788620.'
        text: Short for electronic waste, this term describes discarded electrical
          or electronic devices. It encompasses a wide array of products, from household
          appliances to computers and mobile phones, that are no longer considered
          useful due to malfunction or obsolescence. E-waste is a growing global concern
          due to the volume of its generation and the presence of toxic materials
          that can harm human health and the environment if not managed properly.
      normalized_label: E-waste
      operational_definition: Déchets électroniques, renouvellement matériel, réemploi
        et fin de vie des équipements.
      raw_label: E-waste
      reference_keys:
      - roy2026taxonomy
      source_definition: Short for electronic waste, this term describes discarded
        electrical or electronic devices. It encompasses a wide array of products,
        from household appliances to computers and mobile phones, that are no longer
        considered useful due to malfunction or obsolescence. E-waste is a growing
        global concern due to the volume of its generation and the presence of toxic
        materials that can harm human health and the environment if not managed properly.
      source_definition_label: E-waste
      source_metrics: Amount of non-reusable modules
      status: source_authored
    - category_location: categories and metrics.png, Environmental / Code Sustainability
      coding_guidance: Documenter le lien environnemental. Les affirmations générales
        de qualité ou maintenabilité relèvent aussi potentiellement de Technical,
        sans reclassement automatique.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A8
      dimension: Environmental
      id: TAX-04
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A8, entry
          “Code Sustainability”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This concept involves the development of software with a minimal environmental
          impact. It emphasizes writing efficient code that consumes less energy and
          optimizing the use of resources throughout the software's lifecycle. The
          goal is to create software that is not only functional and reliable but
          also environmentally conscious. This can include practices like code optimization
          and choosing energy-efficient data centers.
      normalized_label: Code Sustainability
      operational_definition: Caractéristiques du code abordées sous l’angle de leur
        empreinte environnementale.
      raw_label: Code Sustainability
      reference_keys:
      - roy2026taxonomy
      source_definition: This concept involves the development of software with a
        minimal environmental impact. It emphasizes writing efficient code that consumes
        less energy and optimizing the use of resources throughout the software's
        lifecycle. The goal is to create software that is not only functional and
        reliable but also environmentally conscious. This can include practices like
        code optimization and choosing energy-efficient data centers.
      source_definition_label: Code Sustainability
      source_metrics: CPU usage; Memory usage; Code smells
      status: source_authored
    - category_location: categories and metrics.png, Environmental / Resource management
      coding_guidance: Préciser la ressource affectée. Le temps humain relève plutôt
        de Individual ou Economic selon le passage ; ne pas l’assimiler automatiquement
        à une ressource environnementale.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A10
      dimension: Environmental
      id: TAX-05
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A10, entry
          “Resource Efficiency”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This is the practice of using resources in the most effective way possible
          while minimizing waste and environmental impact. It involves maximizing
          the output from a given amount of resources, be it materials, energy, or
          water. Resource efficiency is a key strategy for achieving sustainable development,
          as it helps to conserve natural resources and reduce pollution.
      normalized_label: Resource management
      operational_definition: Gestion et consommation des ressources physiques et
        informatiques, notamment eau, stockage et calcul.
      raw_label: Resource management
      reference_keys:
      - roy2026taxonomy
      source_definition: This is the practice of using resources in the most effective
        way possible while minimizing waste and environmental impact. It involves
        maximizing the output from a given amount of resources, be it materials, energy,
        or water. Resource efficiency is a key strategy for achieving sustainable
        development, as it helps to conserve natural resources and reduce pollution.
      source_definition_label: Resource Efficiency
      source_metrics: Energy efficient data management; Water footprint
      status: source_authored
    - category_location: categories and metrics.png, Technical / Perdurability
      coding_guidance: Inclure adaptation et évolution durable ; distinguer la durée
        de vie seule (Longitivity). Ne pas transformer les métriques en sous-codes
        sans décision de recherche.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A12
      dimension: Technical
      id: TAX-06
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A12, entry
          “Perdurability”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: In the context of software, perdurability refers to the ability of a
          system to persist and remain effective over a long period, despite changes
          in its environment or requirements. It is closely related to the concepts
          of durability and long-term viability.
      normalized_label: Perdurability
      operational_definition: Capacité du logiciel à rester utilisable et à évoluer
        malgré des changements techniques et fonctionnels.
      raw_label: Perdurability
      reference_keys:
      - roy2026taxonomy
      source_definition: In the context of software, perdurability refers to the ability
        of a system to persist and remain effective over a long period, despite changes
        in its environment or requirements. It is closely related to the concepts
        of durability and long-term viability.
      source_definition_label: Perdurability
      source_metrics: Technical evolution; functional evolution
      status: source_authored
    - category_location: categories and metrics.png, Technical / Longitivity
      coding_guidance: Conserver « Longitivity » comme libellé source ; « Longevity
        » est une normalisation distincte. La fiabilité peut contribuer à la longévité
        mais ne lui est pas équivalente.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A14
      dimension: Technical
      id: TAX-07
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A14, entry
          “Longevity”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This term emphasizes the lifespan of a product or system. In software,
          it refers to the length of time a system remains useful and operational
          before it becomes obsolete or needs to be replaced. Designing for longevity
          involves creating systems that are adaptable and can evolve with changing
          needs.
      normalized_label: Longevity
      operational_definition: Durée de vie utile, continuité et maintien en fonctionnement
        du logiciel.
      raw_label: Longitivity
      reference_keys:
      - roy2026taxonomy
      source_definition: This term emphasizes the lifespan of a product or system.
        In software, it refers to the length of time a system remains useful and operational
        before it becomes obsolete or needs to be replaced. Designing for longevity
        involves creating systems that are adaptable and can evolve with changing
        needs.
      source_definition_label: Longevity
      source_metrics: Mean time between failures; Aveage life span in usage hours
        per year
      status: source_authored
    - category_location: categories and metrics.png, Technical / Repairability
      coding_guidance: Inclure les préoccupations de débogage et d’entretien attribuées
        au code généré. Une obligation de revue seule est un mécanisme et ne prouve
        pas une dégradation de réparabilité.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A16
      dimension: Technical
      id: TAX-08
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A16, entry
          “Repairability”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This is the ease with which a product or system can be repaired or maintained.
          For hardware, it means designing products with accessible components that
          can be easily replaced. In software, it translates to writing clean, modular,
          and well-documented code that is easy to debug and modify.
      normalized_label: Repairability
      operational_definition: Facilité de diagnostic, de correction et de maintenance,
        soutenue notamment par la modularité et la documentation.
      raw_label: Repairability
      reference_keys:
      - roy2026taxonomy
      source_definition: This is the ease with which a product or system can be repaired
        or maintained. For hardware, it means designing products with accessible components
        that can be easily replaced. In software, it translates to writing clean,
        modular, and well-documented code that is easy to debug and modify.
      source_definition_label: Repairability
      source_metrics: Degree of Cohesion and coupling; Degree of traceability documentation
      status: source_authored
    - category_location: categories and metrics.png, Technical / Feature Bloat
      coding_guidance: Inclure fonctionnalités inutiles, surproduction et complexité
        explicitement liées ; ne pas qualifier tout ajout de fonctionnalité de bloat.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A18
      dimension: Technical
      id: TAX-09
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A18, entry
          “Feature Bloat”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This occurs when a product or software becomes overloaded with excessive
          features, many of which may be unnecessary for the user. Feature bloat can
          lead to a more complex and difficult-to-use product, increased resource
          consumption, and a shorter lifespan as the system becomes unwieldy.
      normalized_label: Feature Bloat
      operational_definition: Accumulation de fonctionnalités superflues et complexité
        qu’elle entraîne.
      raw_label: Feature Bloat
      reference_keys:
      - roy2026taxonomy
      source_definition: This occurs when a product or software becomes overloaded
        with excessive features, many of which may be unnecessary for the user. Feature
        bloat can lead to a more complex and difficult-to-use product, increased resource
        consumption, and a shorter lifespan as the system becomes unwieldy.
      source_definition_label: Feature Bloat
      source_metrics: Percentage of user engagement with each feature
      status: source_authored
    - category_location: categories and metrics.png, Technical / Security Concerns
      coding_guidance: Inclure menaces, vulnérabilités et risques de sécurité explicités.
        Ne pas assimiler toute règle de confidentialité à une vulnérabilité technique
        avérée.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A20
      dimension: Technical
      id: TAX-10
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A20, entry
          “Security Concerns”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This category encompasses the measures taken to protect a system and
          its users from threats and vulnerabilities. In a sustainability context,
          a secure system is one that is resilient to attacks and can be trusted by
          its users over the long term, thus contributing to its overall viability.
      normalized_label: Security Concerns
      operational_definition: Protection durable du logiciel et de ses utilisateurs
        face aux vulnérabilités et attaques.
      raw_label: Security Concerns
      reference_keys:
      - roy2026taxonomy
      source_definition: This category encompasses the measures taken to protect a
        system and its users from threats and vulnerabilities. In a sustainability
        context, a secure system is one that is resilient to attacks and can be trusted
        by its users over the long term, thus contributing to its overall viability.
      source_definition_label: Security Concerns
      source_metrics: Number of known vulnerabilities
      status: source_authored
    - category_location: categories and metrics.png, Social / Digital Inclusivity
      coding_guidance: Inclure obstacles à l’inclusion et diversité des participants
        ; distinguer les conditions de répartition équitable de l’accès, tout en autorisant
        un double codage justifié.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A23
      dimension: Social
      id: TAX-11
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A23, entry
          “Digital Inclusivity”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This refers to ensuring that everyone, regardless of their background,
          ability, or socioeconomic status, has access to and can effectively use
          digital technologies. It is about bridging the digital divide and creating
          a more equitable digital society.
      normalized_label: Digital Inclusivity
      operational_definition: Participation et usage des technologies par des personnes
        de profils, langues et capacités divers.
      raw_label: Digital Inclusivity
      reference_keys:
      - roy2026taxonomy
      source_definition: This refers to ensuring that everyone, regardless of their
        background, ability, or socioeconomic status, has access to and can effectively
        use digital technologies. It is about bridging the digital divide and creating
        a more equitable digital society.
      source_definition_label: Digital Inclusivity
      source_metrics: Number of supported language, demographics
      status: source_authored
    - category_location: categories and metrics.png, Social / Equitable Access
      coding_guidance: Inclure inégalités d’accès et distribution des bénéfices ;
        ne pas supposer que disponibilité technique signifie équité.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A25
      dimension: Social
      id: TAX-12
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A25, entry
          “Equitable Access”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This concept is closely related to digital inclusivity and focuses on
          the fair distribution of access to technology and its benefits. It addresses
          the barriers that can prevent certain groups from accessing and benefiting
          from digital resources.
      normalized_label: Equitable Access
      operational_definition: Répartition équitable de l’accès aux technologies, données
        et bénéfices.
      raw_label: Equitable Access
      reference_keys:
      - roy2026taxonomy
      source_definition: This concept is closely related to digital inclusivity and
        focuses on the fair distribution of access to technology and its benefits.
        It addresses the barriers that can prevent certain groups from accessing and
        benefiting from digital resources.
      source_definition_label: Equitable Access
      source_metrics: End-user data availability; horizontal and vertical equity
      status: source_authored
    - category_location: categories and metrics.png, Social / Ethical Concerns
      coding_guidance: Expliciter le problème éthique mentionné. Ne pas utiliser ce
        code comme catégorie générale pour tout désaccord sur la GenAI.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A27
      dimension: Social
      id: TAX-13
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A27, entry
          “Ethical Concerns”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This broad category covers the moral implications of technology and
          its use. It includes issues such as data privacy, algorithmic bias, and
          the potential for technology to be used for malicious purposes. Addressing
          ethical concerns is crucial for building trust and ensuring that technology
          serves humanity in a positive way.
      normalized_label: Ethical Concerns
      operational_definition: 'Préoccupations morales relatives aux usages du logiciel
        : biais, équité, pratiques responsables et risques pour les personnes.'
      raw_label: Ethical Concerns
      reference_keys:
      - roy2026taxonomy
      source_definition: This broad category covers the moral implications of technology
        and its use. It includes issues such as data privacy, algorithmic bias, and
        the potential for technology to be used for malicious purposes. Addressing
        ethical concerns is crucial for building trust and ensuring that technology
        serves humanity in a positive way.
      source_definition_label: Ethical Concerns
      source_metrics: Degree of bias
      status: source_authored
    - category_location: categories and metrics.png, Social / Customer social value
      coding_guidance: Distinguer satisfaction, feedback et effet social établi ;
        documenter qui bénéficie de la valeur évoquée.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A29
      dimension: Social
      id: TAX-14
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A29, entry
          “Customer Social Value”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This refers to the positive social impact that a product or service
          creates for its customers and the wider community. It goes beyond the direct
          functional benefits to consider how the product contributes to social well-being
          and addresses societal needs.
      normalized_label: Customer social value
      operational_definition: Valeur et effets sociaux du logiciel pour ses utilisateurs
        et les communautés concernées.
      raw_label: Customer social value
      reference_keys:
      - roy2026taxonomy
      source_definition: This refers to the positive social impact that a product
        or service creates for its customers and the wider community. It goes beyond
        the direct functional benefits to consider how the product contributes to
        social well-being and addresses societal needs.
      source_definition_label: Customer Social Value
      source_metrics: Amount of positive feedbacks
      status: source_authored
    - category_location: categories and metrics.png, Social / Social Engineering
      coding_guidance: Ne pas choisir silencieusement un sens. Dans le mémo du passage,
        préciser la source et le sens retenus ; une préoccupation de bien-être peut
        également relever de Health, extension individuelle provisoire.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A31
      dimension: Social
      id: TAX-15
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A31, entry
          “Social Engineering”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: In the context of information security, this is the use of deception
          to manipulate individuals into divulging confidential or personal information
          that may be used for fraudulent purposes. From a broader social sustainability
          perspective, it highlights the vulnerability of individuals in the digital
          realm and the need for education and protection.
      normalized_label: Social Engineering
      operational_definition: 'Catégorie documentaire dont le sens diverge entre les
        pièces : bien-être dans la figure, manipulation et tromperie dans le classeur.'
      raw_label: Social Engineering
      reference_keys:
      - roy2026taxonomy
      source_definition: In the context of information security, this is the use of
        deception to manipulate individuals into divulging confidential or personal
        information that may be used for fraudulent purposes. From a broader social
        sustainability perspective, it highlights the vulnerability of individuals
        in the digital realm and the need for education and protection.
      source_definition_label: Social Engineering
      source_metrics: Well Being
      status: source_authored
    - category_location: categories and metrics.png, Social / User error protection
      coding_guidance: Inclure protections, assistance et récupération pour les utilisateurs
        ; distinguer erreurs d’usage et erreurs de programmation sans lien explicité.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A33
      dimension: Social
      id: TAX-16
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A33, entry
          “User Error Protection”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This involves designing systems and interfaces that minimize the likelihood
          of users making errors and that provide clear and helpful guidance when
          errors do occur. It is about creating a more user-friendly and forgiving
          digital environment, which contributes to a more positive and less stressful
          user experience.
      normalized_label: User error protection
      operational_definition: Prévention des erreurs d’usage et possibilité de récupération
        après une erreur.
      raw_label: User error protection
      reference_keys:
      - roy2026taxonomy
      source_definition: This involves designing systems and interfaces that minimize
        the likelihood of users making errors and that provide clear and helpful guidance
        when errors do occur. It is about creating a more user-friendly and forgiving
        digital environment, which contributes to a more positive and less stressful
        user experience.
      source_definition_label: User Error Protection
      source_metrics: Recovery Time
      status: source_authored
    - category_location: categories and metrics.png, Economic / Circular Economy
      coding_guidance: Identifier si le passage traite de matériel, de services ou
        de code ; ne pas assimiler automatiquement toute réutilisation à un bénéfice
        économique ou environnemental établi.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A35
      dimension: Economic
      id: TAX-17
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A35, entry
          “Circular Economy”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This is an economic model that aims to eliminate waste and promote the
          continual use of resources. In a circular economy, products are designed
          to be durable, repairable, and recyclable, so that their materials can be
          returned to the production cycle at the end of their life.
      normalized_label: Circular Economy
      operational_definition: Réemploi, réparation, recyclage et circulation des ressources
        pour réduire leur mise au rebut.
      raw_label: Circular Economy
      reference_keys:
      - roy2026taxonomy
      source_definition: This is an economic model that aims to eliminate waste and
        promote the continual use of resources. In a circular economy, products are
        designed to be durable, repairable, and recyclable, so that their materials
        can be returned to the production cycle at the end of their life.
      source_definition_label: Circular Economy
      source_metrics: Percentage of reused code or services; Amount of shared infrastructure
      status: source_authored
    - category_location: categories and metrics.png, Economic / Affordability
      coding_guidance: Préciser qui supporte le coût et pour qui l’accès devient possible
        ou impossible ; distinguer accessibilité financière et simple baisse des coûts
        internes.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A37
      dimension: Economic
      id: TAX-18
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A37, entry
          “Affordability”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This refers to the ability of individuals and organizations to purchase
          a product or service without undue financial hardship. In a sustainability
          context, affordability is about ensuring that sustainable choices are accessible
          to everyone, not just a privileged few.
      normalized_label: Affordability
      operational_definition: Accessibilité financière des outils, infrastructures
        et services pour les acteurs concernés.
      raw_label: Affordability
      reference_keys:
      - roy2026taxonomy
      source_definition: This refers to the ability of individuals and organizations
        to purchase a product or service without undue financial hardship. In a sustainability
        context, affordability is about ensuring that sustainable choices are accessible
        to everyone, not just a privileged few.
      source_definition_label: Affordability
      source_metrics: Access Cost
      status: source_authored
    - category_location: categories and metrics.png, Economic / Cost efficiency
      coding_guidance: Inclure arbitrages sur l’effort et les ressources ; distinguer
        efficacité économique, épuisement individuel et efficacité énergétique, avec
        double codage seulement si justifié.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A39
      dimension: Economic
      id: TAX-19
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A39, entry
          “Cost Efficiency”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This is about maximizing the value derived from a given amount of resources.
          In software development, it involves optimizing development processes and
          resource allocation to create high-quality software in a cost-effective
          manner. Cost efficiency contributes to the economic viability of a project
          and its long-term sustainability.
      normalized_label: Cost efficiency
      operational_definition: Rapport entre ressources engagées et valeur produite,
        notamment coûts de développement, temps et effort.
      raw_label: Cost efficiency
      reference_keys:
      - roy2026taxonomy
      source_definition: This is about maximizing the value derived from a given amount
        of resources. In software development, it involves optimizing development
        processes and resource allocation to create high-quality software in a cost-effective
        manner. Cost efficiency contributes to the economic viability of a project
        and its long-term sustainability.
      source_definition_label: Cost Efficiency
      source_metrics: Development cost- number of workers; amount of time and effort
      status: source_authored
    - category_location: categories and metrics.png, Economic / Software process evolving
        intellectual capital
      coding_guidance: Préserver le libellé et les métriques de la figure. La définition
        « Software Process Evolution » du classeur est apparentée mais n’est pas une
        preuve d’équivalence terminologique.
      definition_location: Sustainability Category Correlations.xlsx, Definitions!A41
      dimension: Economic
      id: TAX-20
      memo_excerpts:
      - source: 'Sustainability Category Correlations.xlsx, Definitions!A41, entry
          “Software Process Evolution”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy],
          DOI 10.1145/3786148.3788620.'
        text: This refers to the continuous improvement and adaptation of the processes
          used to develop and maintain software. It involves learning from experience,
          adopting new technologies and methodologies, and evolving processes to meet
          changing needs and challenges. A commitment to process evolution is essential
          for long-term economic sustainability in the fast-paced world of software
          development.
      normalized_label: Software process evolving intellectual capital
      operational_definition: Capital intellectuel et valeur issus de l’évolution
        des processus logiciels, des connaissances et de la capacité d’innovation.
      raw_label: Software process evolving intellectual capital
      reference_keys:
      - roy2026taxonomy
