  memo: '“This term emphasizes the lifespan of a product or system. In software, it
    refers to the length of time a system remains useful and operational before it
    becomes obsolete or needs to be replaced. Designing for longevity involves creating
    systems that are adaptable and can evolve with changing needs.”


    — Sustainability Category Correlations.xlsx, Definitions!A14, entry “Longevity”.
    Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
