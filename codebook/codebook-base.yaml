    interpretation_rules:
    - Dimensions and first/second/third-order effects are independent axes.
    - A policy mechanism is not an effect; a policy claim is not an empirically observed
      consequence.
    - Operational definitions and inclusion guidance are researcher proposals; retain
      their distinction from source definitions.
    - The correlation workbook contains proposed influences, not statistical or causal
      evidence.
    - Preserve raw source labels and document disagreements; do not force the 250
      requirement rows into these categories.
    memo_style: English verbatim reference excerpts with source citations
    paper:
      authors: Mandira Roy, Novarun Deb, Agostino Cortesi, Nabendu Chaki
      doi: 10.1145/3786148.3788620
      scope_note: Four dimensions in original taxonomy; individual dimension excluded
        explicitly on PDF page 5 (printed page 26).
      title: Towards a Taxonomy of Sustainability Requirements for Software Design
      year: 2026
