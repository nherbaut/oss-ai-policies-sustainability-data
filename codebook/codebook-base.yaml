  kind: code
  memo: '“This is the ease with which a product or system can be repaired or maintained.
    For hardware, it means designing products with accessible components that can
    be easily replaced. In software, it translates to writing clean, modular, and
    well-documented code that is easy to debug and modify.”


    — Sustainability Category Correlations.xlsx, Definitions!A16, entry “Repairability”.
    Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
