  kind: code
  memo: '“This refers to the total amount of energy utilized in a particular process
    or by a specific entity, such as a household or a business. It is a critical component
    of the environmental impact, as energy production, particularly from fossil fuels,
    is a major source of greenhouse gas emissions. The concept is intrinsically linked
    to energy efficiency, where higher consumption indicates lower efficiency.”


    — Sustainability Category Correlations.xlsx, Definitions!A4, entry “Energy Consumption”.
    Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
