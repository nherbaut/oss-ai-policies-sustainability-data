  kind: code
  memo: '“This is a measure of the total greenhouse gas (GHG) emissions caused directly
    and indirectly by an individual, organization, event, or product. It is expressed
    in terms of the amount of carbon dioxide (CO2) or its equivalent of other GHGs.
    The carbon footprint considers the entire life cycle of a product or activity,
    from the extraction of raw materials to its final disposal.”


    — Sustainability Category Correlations.xlsx, Definitions!A2, entry “Carbon Footprint”.
    Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
