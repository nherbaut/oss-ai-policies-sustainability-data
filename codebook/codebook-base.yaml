  kind: code
  memo: '“This concept involves the development of software with a minimal environmental
    impact. It emphasizes writing efficient code that consumes less energy and optimizing
    the use of resources throughout the software''s lifecycle. The goal is to create
    software that is not only functional and reliable but also environmentally conscious.
    This can include practices like code optimization and choosing energy-efficient
    data centers.”


    — Sustainability Category Correlations.xlsx, Definitions!A8, entry “Code Sustainability”.
    Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
