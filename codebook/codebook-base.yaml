  kind: code
  memo: '“This is the practice of using resources in the most effective way possible
    while minimizing waste and environmental impact. It involves maximizing the output
    from a given amount of resources, be it materials, energy, or water. Resource
    efficiency is a key strategy for achieving sustainable development, as it helps
    to conserve natural resources and reduce pollution.”


    — Sustainability Category Correlations.xlsx, Definitions!A10, entry “Resource
    Efficiency”. Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
