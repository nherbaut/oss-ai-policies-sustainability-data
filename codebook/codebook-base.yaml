  kind: code
  memo: '“Short for electronic waste, this term describes discarded electrical or
    electronic devices. It encompasses a wide array of products, from household appliances
    to computers and mobile phones, that are no longer considered useful due to malfunction
    or obsolescence. E-waste is a growing global concern due to the volume of its
    generation and the presence of toxic materials that can harm human health and
    the environment if not managed properly.”


    — Sustainability Category Correlations.xlsx, Definitions!A6, entry “E-waste”.
    Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
