  memo: '“This broad category covers the moral implications of technology and its
    use. It includes issues such as data privacy, algorithmic bias, and the potential
    for technology to be used for malicious purposes. Addressing ethical concerns
    is crucial for building trust and ensuring that technology serves humanity in
    a positive way.”


    — Sustainability Category Correlations.xlsx, Definitions!A27, entry “Ethical Concerns”.
    Associated taxonomy: Roy et al. (2026), [@roy2026taxonomy], DOI 10.1145/3786148.3788620.'
